<article class="stat-card"><div class="flex justify-between"><span class="metric {{ tone }}">{{ icon }}</span>{% if trend %}<span class="trend">{{ trend }}</span>{% endif %}</div><strong>{{ value }}</strong><h3>{{ title }}</h3><p>{{ info }}</p>{% if periods %}<div class="dashboard-stat-periods"><span>Tahun <b>{{ periods.year }}</b></span><span>Bulan <b>{{ periods.month }}</b></span>{% if show_day %}<span>Hari ini <b>{{ periods.day }}</b></span>{% endif %}</div>{% endif %}</article>
