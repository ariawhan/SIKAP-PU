<body class="bg-[#f4f7f5] text-slate-800 antialiased">{% block body %}{% endblock %}<script src="{% static 'js/app.js' %}?v=20260926-1"></script><script src="{% static 'js/action-menu.js' %}?v=20261123-1"></script>{% if DEV_BROWSER_AUTO_RELOAD %}<script>(function(){var token;var endpoint="{% url 'dev_browser_reload_token' %}";async function check(){try{var response=await fetch(endpoint,{cache:"no-store"});if(!response.ok)return;var next=(await response.json()).token;if(token&&next!==token){window.location.reload();return}token=next}catch(error){}}check();window.setInterval(check,1500)})()</script>{% endif %}{% block extra_scripts %}{% endblock %}</body></html>
