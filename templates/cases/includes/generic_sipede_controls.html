{% load static %}{% if can_edit %}<button type="button" class="p16-sipede-button" data-sop-sipede data-url="{% url sipede_url_name draft.pk %}"{% if draft.sipede_status == 'sudah' %} disabled{% endif %}>{% if draft.sipede_status == 'sudah' %}Sudah di SIPede{% else %}Ambil Nomor &amp; Upload SIPede{% endif %}</button>{% endif %}
<div class="p16-sipede-modal" data-sop-sipede-modal hidden><button type="button" class="p16-sipede-backdrop" data-sop-sipede-close></button><section class="p16-sipede-dialog" role="dialog" aria-modal="true"><button type="button" class="p16-sipede-close" data-sop-sipede-close>&times;</button><header><img src="{% static 'img/sipede-color.png' %}" alt="SIPede"><div><small>ADMINISTRASI PERKARA</small><h2>Upload {{ document_label }} ke SIPede</h2></div></header><p data-sop-sipede-message>Periksa data sebelum mengambil nomor resmi dan mengunggah PDF.</p><div class="p16-sipede-fields"><label>Sifat<select data-sop-sipede-field="sifat"><option value="B">Biasa</option><option value="T">Terbatas</option><option value="R">Rahasia</option><option value="SR">Sangat Rahasia</option><option value="PRIN">Perintah</option></select></label><label>Kode masalah<input required value="{{ form.number_letter_code|default:'' }}" data-sop-sipede-field="kode_masalah"></label><label>Tujuan<textarea required data-sop-sipede-field="tujuan">{{ sipede_destination }}</textarea></label><label>Perihal<textarea required data-sop-sipede-field="perihal">{{ sipede_subject }}</textarea></label><label>Ditandatangani oleh<select required data-sop-sipede-field="penandatangan">{% for name in sipede_signatory_names %}<option value="{{ name }}"{% if name == default_sipede_signatory %} selected{% endif %}>{{ name }}</option>{% endfor %}</select></label></div><div class="p16-sipede-progress" data-sop-sipede-progress hidden><i></i><span>Memproses…</span></div><footer><button type="button" class="secondary-btn" data-sop-sipede-close>Batal</button><button type="button" class="primary-btn" data-sop-sipede-confirm>Lanjut</button></footer></section></div><div class="p16-disposition-modal" data-sop-disposition-modal hidden><button type="button" class="p16-disposition-backdrop" data-sop-disposition-close></button><section class="p16-disposition-dialog"><header><span>⇄</span><div><small>SIPEDE</small><h2>Penerusan Surat</h2></div></header><div class="p16-disposition-options" data-sop-disposition-options></div><footer><button type="button" class="secondary-btn" data-sop-disposition-close>Batal</button><button type="button" class="primary-btn" data-sop-disposition-confirm>Buat PDF &amp; Kirim</button></footer></section></div>
